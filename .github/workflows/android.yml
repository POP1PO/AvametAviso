name: Construir APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas del núcleo Python (referencia)
        working-directory: python_nucleo
        run: |
          python tests/test_nucleo.py
          python tests/test_peligro.py
          python tests/test_vectores.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # El runner de GitHub ya trae el SDK de Android; solo se aceptan las licencias.
      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Si el port a Kotlin no da lo mismo que Python, aquí se para y NO se genera APK.
      - name: Pruebas Kotlin (vectores dorados)
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Preparar la clave de firma (solo si hay secretos configurados)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/clave.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/clave.jks" >> "$GITHUB_ENV"
            echo "Firmando con la clave propia"
          else
            echo "::warning::Sin KEYSTORE_BASE64: el APK se firma con la clave pública fija de app/firma/aviso.jks (las actualizaciones se instalan encima, pero cualquiera podría firmar una app con esa clave)."
          fi

      - name: Compilar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: AvametAviso-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # APK descargable desde el móvil: pestaña Releases -> «Última versión» (se reemplaza en cada ejecución sobre main).
      - name: Publicar APK en Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk AvametAviso.apk
          # La API de GitHub devuelve a veces 5xx de forma pasajera: se reintenta (borrar + crear) hasta 5 veces.
          # Copia permanente de cada versión (v<nº>): conserva su contador de descargas (la release «ultima» se recrea cada vez y el suyo vuelve a 0).
          for intento in 1 2 3 4 5; do
            gh release view "v$GITHUB_RUN_NUMBER" >/dev/null 2>&1 && break
            gh release create "v$GITHUB_RUN_NUMBER" AvametAviso.apk --title "Versión nº $GITHUB_RUN_NUMBER" --target "$GITHUB_SHA" --latest=false \
              --notes "Copia archivada de la versión nº $GITHUB_RUN_NUMBER (commit $GITHUB_SHA)." && break
            sleep 20
          done
          for intento in 1 2 3 4 5; do
            gh release delete ultima --yes --cleanup-tag || true
            if gh release create ultima AvametAviso.apk --title "Última versión (nº $GITHUB_RUN_NUMBER)" --target "$GITHUB_SHA" \
                 --notes "APK generado automáticamente por GitHub Actions (commit $GITHUB_SHA). versionCode=$GITHUB_RUN_NUMBER"; then
              exit 0
            fi
            echo "Intento $intento fallido; reintentando en 20 s"; sleep 20
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: informes-de-pruebas
          path: app/build/reports/tests/
          if-no-files-found: ignore
